services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuellead}
      POSTGRES_USER: ${POSTGRES_USER:-fuellead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - fuellead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuellead} -d ${POSTGRES_DB:-fuellead}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fuellead:change-me@db:5432/fuellead}
      MAIL_CREDENTIALS_ENCRYPTION_KEY: ${MAIL_CREDENTIALS_ENCRYPTION_KEY:-}
      OUTREACH_AUTOMATIC_SEND_ENABLED: ${OUTREACH_AUTOMATIC_SEND_ENABLED:-false}
      FUELLEAD_AUTH_EMAIL: ${FUELLEAD_AUTH_EMAIL:-}
      FUELLEAD_AUTH_PASSWORD: ${FUELLEAD_AUTH_PASSWORD:-}
      FUELLEAD_AUTH_SESSION_SECRET: ${FUELLEAD_AUTH_SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  imap-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.commands.run_imap_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fuellead:change-me@db:5432/fuellead}
      MAIL_CREDENTIALS_ENCRYPTION_KEY: ${MAIL_CREDENTIALS_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  fuellead_postgres_data:
